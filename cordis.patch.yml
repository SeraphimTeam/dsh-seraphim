# Seraphim — merged LLM provider bundle patch.
# A single host row (llm-seraphim) that registers all five providers
# (claude-code, freebuff, commandcode, zed, codex) as native dsh LLM routes.
# The merged plugin fans out to each provider's own apply() with its own
# settings namespace, so the picker shows all five providers and their models
# exactly as before the merge. It does NOT change the profile's default model
# or web-search route.
#
# `name` is the merged plugin package; the config below is the union of the
# five original per-provider configs, keyed by provider.
- insert:
    - id: llm-seraphim
      name: dsh-seraphim
      config:
        providers:
          claude-code:
            baseURL: https://api.anthropic.com
            oauthAuthorizeURL: https://claude.com/cai/oauth/authorize
            oauthTokenURL: https://platform.claude.com/v1/oauth/token
            oauthClientId: 9d1c250a-e61b-44d9-88ed-5944d1962f5e
            clientVersion: 2.1.162
            models:
              - { id: anthropic/claude-opus-5, name: Claude Opus 5, upstream: claude-opus-5, contextWindow: 200000, maxTokens: 32768 }
              - { id: anthropic/claude-sonnet-5, name: Claude Sonnet 5, upstream: claude-sonnet-5, contextWindow: 200000, maxTokens: 32768 }
              - { id: anthropic/claude-opus-4-8, name: Claude Opus 4.8, upstream: claude-opus-4-8, contextWindow: 200000, maxTokens: 32768 }
              - { id: anthropic/claude-opus-4-7, name: Claude Opus 4.7, upstream: claude-opus-4-7, contextWindow: 200000, maxTokens: 32768 }
              - { id: anthropic/claude-sonnet-4-6, name: Claude Sonnet 4.6, upstream: claude-sonnet-4-6, contextWindow: 200000, maxTokens: 32768 }
